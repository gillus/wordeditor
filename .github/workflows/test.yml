# Runs the full test suite (python-docx sample + Playwright/Chromium editing tests) on pushes and PRs.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_OUT: ${{ github.workspace }}/e2e-out
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: pip install -r tests/requirements.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p "$E2E_OUT"
      - run: npm test
      # The edited .docx files the tests saved, for inspecting a failure.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: e2e-out
          if-no-files-found: ignore
